<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Editor C++ | Website Buatan Muhammad Anhar Solihin</title>
  <meta name="description" content="Editor C++ online interaktif bergaya W3Schools. Website buatan Muhammad Anhar Solihin.">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2304AA6D'/><text x='50%' y='65%' font-size='52' font-weight='bold' text-anchor='middle' fill='%23ffffff' font-family='monospace'>C++</text></svg>">
</head>
<body>

  <!-- ========================================================================
       EDITOR TOP BAR
       ======================================================================== -->
  <header class="editor-header">
    <div class="editor-header-left">
      <a href="index.html" class="btn-back-tutorial" id="btnBackTutorial" title="Kembali ke halaman materi">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Kembali ke Tutorial</span>
      </a>

      <div class="editor-brand">
        <span class="editor-brand-badge">C++</span>
        <span class="editor-brand-text" id="topicNameLabel">Editor C++ - Website Buatan Muhammad Anhar Solihin</span>
      </div>
    </div>

    <div class="editor-header-right">
      <button class="btn-editor-action btn-reset" id="btnResetCode" title="Kembalikan kode awal">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        <span>Atur Ulang</span>
      </button>

      <button class="btn-editor-action btn-run" id="btnRunCode" title="Kompilasi dan jalankan kode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>Jalankan Kode</span>
      </button>
    </div>
  </header>

  <!-- ========================================================================
       WORKSPACE CONTAINER (SPLIT SCREEN: CODE & TERMINAL)
       ======================================================================== -->
  <main class="editor-workspace">
    
    <!-- Code Editor Section -->
    <section class="workspace-pane editor-section">
      <div class="pane-bar">
        <div class="pane-bar-left">
          <span class="pane-tab active">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            main.cpp
          </span>
        </div>
        <div class="pane-bar-right">
          <span class="pane-status-tag">Editor Kode (Dapat Diedit)</span>
        </div>
      </div>

      <div class="editor-body">
        <textarea id="codeEditorArea" class="code-editor-textarea" spellcheck="false" placeholder="Tuliskan kode program C++ di sini..."></textarea>
      </div>
    </section>

    <!-- Terminal Output Section -->
    <section class="workspace-pane output-section">
      <div class="pane-bar">
        <div class="pane-bar-left">
          <span class="pane-tab active">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 17 10 11 4 5"></polyline>
              <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
            Terminal Output
          </span>
        </div>
        <div class="pane-bar-right">
          <span class="pane-status-tag tag-green">GCC Simulator C++17</span>
        </div>
      </div>

      <div class="output-body">
        <pre id="terminalOutputConsole" class="terminal-console"></pre>
      </div>
    </section>

  </main>

  <!-- Scripts -->
  <script src="js/topics.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
